[package]
name = "katastro"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
default-run = "katastro"

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:egui_plot", "dep:egui_extras", "dep:rfd", "dep:objc2"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
ring = "0.17"
hex = "0.4"
tempfile = "3"
getrandom = "0.4"
rand = "0.10"
sgf-parse = "4.2.8"
encoding_rs = "0.8"
eframe = { version = "=0.36.2", optional = true, default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
egui_plot = { version = "=0.37.0", optional = true }
rfd = { version = "0.17", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "cookies"] }
scraper = "0.24"
zeroize = "1"
time = { version = "0.3.55", features = ["local-offset", "macros", "parsing", "serde-human-readable"] }
egui_extras = { version = "=0.36.2", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
security-framework = "3"

[dev-dependencies]
egui_kittest = { version = "=0.36.2", features = ["eframe", "wgpu"] }
tiny_http = "0.12"

[[bin]]
name = "katastro"
path = "src/main.rs"
required-features = ["desktop"]

[profile.release]
lto = "thin"

[[bin]]
name = "katastro-test-engine"
path = "tests/support/engine.rs"

[[bin]]
name = "katastro-native-dialog-probe"
path = "tests/support/native_dialog_probe.rs"
required-features = ["desktop"]

[build-dependencies]
serde_json = "1"
